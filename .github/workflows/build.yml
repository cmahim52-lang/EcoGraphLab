name: Build EcoGraph Lab for Windows

on:
  workflow_dispatch:      # ম্যানুয়ালি চালানোর জন্য

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build executable with PyInstaller
      run: |
        python -m PyInstaller --clean --noconfirm --windowed --onefile --name "EcoGraph Lab" --collect-all PySide6 --collect-all matplotlib --collect-all openpyxl --collect-all docx "EcoGraphLab.py"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: EcoGraph-Lab-Windows
        path: dist\EcoGraph Lab.exe
